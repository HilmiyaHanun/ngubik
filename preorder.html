<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Order</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=table_restaurant" />
    <link rel="stylesheet" href="preorder.css">
</head>
<body>
    <div class="preorder">
        <span class="page-info">PAGE PRE-ORDER</span>

        <div>
            <a href="bookseat.html" title="Ke halaman Book Seat">
                <span class="material-symbols-outlined">table_restaurant</span>
            </a>
        </div>

        <h1 class="main-title">PRE-ORDER</h1>

        <h3 class="sub-title">MAKANAN</h3>
        <table class="menu">
            <thead>
                <tr>
                    <th class="name">Menu</th>
                    <th class="price">Harga</th>
                    <th class="qty">Jumlah</th>
                </tr>
            </thead>
            <tbody id="foodList"></tbody>
        </table>

        <h3 class="sub-title">MINUMAN</h3>
        <table class="menu">
            <thead>
                <tr>
                    <th class="name">Menu</th>
                    <th class="price">Harga</th>
                    <th class="qty">Jumlah</th>
                </tr>
            </thead>
            <tbody id="drinkList"></tbody>
        </table>
        
        <div class="summation">
            <div class="sum-info">
                <span>TOTAL </span>
                <strong id="totalDisplay">Rp 0</strong>
            </div>
            <a href="payment.html" class="sub-navigation">NEXT</a>
        </div>
    </div>

    <script src="preorder.js"></script>
</body>
</html>
