<div id="seatList"></div>

<script>
  // 1. Data awal kursi (hanya dibuat jika localStorage masih kosong)
  const defaultSeats = [
    { id: 1, name: "Table #1", capacity: 4, available: true },
    { id: 2, name: "Table #2", capacity: 4, available: true },
    { id: 3, name: "Seat #3", capacity: 1, available: true },
    { id: 4, name: "Seat #4", capacity: 1, available: true }
  ];

  let seatsData = JSON.parse(localStorage.getItem("seatsData"));
  if (!seatsData || seatsData.length === 0) {
    seatsData = defaultSeats;
    localStorage.setItem("seatsData", JSON.stringify(seatsData));
  }

  // 2. Fungsi menampilkan daftar kursi
  function renderSeats() {
    const seatList = document.getElementById("seatList");
    seatList.innerHTML = "";

    seatsData.forEach((seat, index) => {
      const card = document.createElement("div");
      card.className = "seat-card"; // Sesuaikan dengan nama class CSS kamu

      card.innerHTML = `
        <div>
          <h3>${seat.name}</h3>
          <p>Kapasitas: ${seat.capacity} Orang</p>
          <p>Status: 
            <strong style="color: ${seat.available ? 'green' : 'red'};">
              ${seat.available ? 'Tersedia' : 'Sudah Dipesan'}
            </strong>
          </p>
        </div>
        <div>
          ${
            seat.available
              ? `<button onclick="pilihSeat(${index})">Book</button>`
              : `<button onclick="unbookSeat(${index})">Unbook</button>`
          }
        </div>
      `;

      seatList.appendChild(card);
    });
  }

  // 3. Pindah ke halaman konfirmasi saat tombol Book ditekan
  function pilihSeat(index) {
    const seatDipilih = seatsData[index];
    localStorage.setItem("selectedSeat", JSON.stringify(seatDipilih));
    
    // Ganti "confirm.html" sesuai dengan nama file HTML Gambar 2 milikmu
    window.location.href = "confirm.html";
  }

  // 4. Membatalkan pesanan kursi (Unbook)
  function unbookSeat(index) {
    const yakin = confirm(`Batalkan pesanan untuk ${seatsData[index].name}?`);
    if (!yakin) return;

    seatsData[index].available = true;
    localStorage.setItem("seatsData", JSON.stringify(seatsData));
    renderSeats();
  }

  renderSeats();
</script>
